<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>班级故事 · 记忆网站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    overflow-x: hidden; background: #f6f8ff; color: #3a3a4a;
  }

  /* ===== 与主页一致的浅色流动背景 ===== */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; filter: blur(100px) saturate(145%); }
  .blob { position: absolute; border-radius: 50%; opacity: 0.62; will-change: transform, filter; }
  .blob.b1 { width: 135vmax; height: 135vmax; left: -35vmax; top: -35vmax; background: radial-gradient(circle at 40% 40%, #ffb0d0, transparent 67%); animation: float1 20s ease-in-out infinite, hue 20s linear infinite; }
  .blob.b2 { width: 128vmax; height: 128vmax; right: -38vmax; top: -30vmax; background: radial-gradient(circle at 60% 40%, #aecbff, transparent 67%); animation: float2 20s ease-in-out infinite, hue 20s linear infinite; }
  .blob.b3 { width: 130vmax; height: 130vmax; left: -25vmax; bottom: -40vmax; background: radial-gradient(circle at 40% 60%, #d4bcff, transparent 67%); animation: float3 20s ease-in-out infinite, hue 20s linear infinite; }
  .blob.b4 { width: 122vmax; height: 122vmax; right: -30vmax; bottom: -35vmax; background: radial-gradient(circle at 50% 50%, #a6ecdd, transparent 67%); animation: float4 20s ease-in-out infinite, hue 20s linear infinite; }
  @keyframes hue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @keyframes float1 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(12vmax,8vmax) scale(1.12)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes float2 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-11vmax,10vmax) scale(1.1)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes float3 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(10vmax,-8vmax) scale(1.14)} 100%{transform:translate(0,0) scale(1)} }
  @keyframes float4 { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-9vmax,-9vmax) scale(1.1)} 100%{transform:translate(0,0) scale(1)} }
  .veil { position: fixed; inset: 0; z-index: 1; background: radial-gradient(ellipse at center, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 55%); pointer-events: none; }

  /* ===== 顶栏 ===== */
  .topbar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; gap: 10px; flex-wrap: wrap; }
  .topbar .title { font-size: 18px; letter-spacing: 0.12em; color: #3a3a4a; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { cursor: pointer; padding: 9px 16px; border-radius: 999px; font-size: 13px; letter-spacing: 0.08em;
    border: 1px solid rgba(58,58,74,0.12); background: rgba(255,255,255,0.55); color: #3a3a4a;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .3s, background .3s; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.85); }
  .btn.primary { background: linear-gradient(90deg, #ff9ad2, #9ec1ff); color: #2a2440; font-weight: 700; border: none; }
  .back { text-decoration: none; color: #3a3a4a; padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(58,58,74,0.12); background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px; letter-spacing: 0.08em;
    transition: transform .3s, background .3s; }
  .back:hover { transform: translateY(-2px); background: rgba(255,255,255,0.85); }
  html.embedded .back { display: none; }

  /* ===== 列表 ===== */
  .wrap { position: relative; z-index: 2; max-width: 1080px; margin: 0 auto; padding: 8px 18px 60px; }
  .sub { color: #7a7a92; font-size: 13px; letter-spacing: 0.04em; margin: 2px 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .person { cursor: pointer; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.85);
    border-radius: 20px; overflow: hidden; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(58,58,74,0.12); transition: transform .3s, box-shadow .3s, background .3s; }
  .person:hover { transform: translateY(-4px); background: rgba(255,255,255,0.92);
    box-shadow: 0 16px 42px rgba(255,150,200,0.26), 0 12px 36px rgba(140,170,255,0.22); }
  .person .thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: linear-gradient(135deg, #ffd9ec, #d6e2ff); display: block; }
  .person .ph-placeholder { width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
    font-size: 34px; background: linear-gradient(135deg, #ffe1f0, #ddeaff); color: #b9a9d8; }
  .person .meta { padding: 12px 14px 14px; }
  .person .pname { font-size: 16px; font-weight: 700; color: #3a3a4a; letter-spacing: 0.04em; }
  .person .pstory { font-size: 13px; color: #6a6a82; margin-top: 5px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .person .ptime { font-size: 11px; color: #a0a0b8; margin-top: 8px; }
  .empty { text-align: center; color: #9a9ab0; font-size: 15px; line-height: 2; padding: 60px 20px; }
  .empty .big { font-size: 40px; }

  /* ===== 详情（时间轴） ===== */
  .detail { position: relative; z-index: 2; max-width: 720px; margin: 0 auto; padding: 8px 18px 60px; }
  .detail.hidden, .list.hidden, .modal.hidden { display: none !important; }
  .dname { font-size: 22px; font-weight: 700; letter-spacing: 0.06em; color: #3a3a4a; margin: 4px 0 2px; }
  .dtime { font-size: 12px; color: #a0a0b8; margin-bottom: 8px; }
  .addphoto { margin-top: 4px; margin-bottom: 22px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* 时间轴主体 */
  .timeline { position: relative; padding-left: 30px; }
  .timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(180deg, rgba(255,154,210,0.55), rgba(158,193,255,0.55)); border-radius: 2px; }
  .tnode { position: relative; margin-bottom: 22px; }
  .tdot { position: absolute; left: -30px; top: 4px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 2px solid rgba(158,193,255,0.9); box-shadow: 0 0 0 4px rgba(158,193,255,0.14);
    display: flex; align-items: center; justify-content: center; }
  .tdot::after { content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #ff9ad2, #9ec1ff);
    box-shadow: 0 0 10px 2px rgba(255,154,210,0.55); animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
  .tcard { background: rgba(255,255,255,0.72); border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 10px 30px rgba(58,58,74,0.12);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: transform .3s, box-shadow .3s; }
  .tcard:hover { transform: translateY(-3px); box-shadow: 0 16px 42px rgba(255,150,200,0.22), 0 12px 36px rgba(140,170,255,0.18); }
  .tdate { padding: 12px 16px 0; font-size: 12px; color: #a0a0b8; letter-spacing: 0.04em; }
  .ttitle { padding: 4px 16px 0; font-size: 16px; font-weight: 700; color: #3a3a4a; letter-spacing: 0.04em; }
  .tbody { padding: 8px 16px 0; font-size: 14px; color: #55556a; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
  .tphotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 12px 16px 16px; }
  .tphotos img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; cursor: zoom-in;
    background: linear-gradient(135deg, #ffe1f0, #ddeaff); transition: transform .25s; }
  .tphotos img:hover { transform: scale(1.03); }
  .tmeta { padding: 0 16px 14px; font-size: 11px; color: #b0b0c4; }
  .tempty { padding: 40px 10px 30px; text-align: center; color: #9a9ab0; font-size: 14px; line-height: 2; }

  /* 图片放大查看 */
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(20,16,34,0.88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox.hidden { display: none !important; }
  .lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,0.5); }

  .story-box { background: rgba(255,255,255,0.72); border-radius: 18px; padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 10px 30px rgba(58,58,74,0.12); margin-top: 18px; }
  .story-box h3 { font-size: 15px; letter-spacing: 0.06em; color: #5a4a8a; margin-bottom: 10px; }
  .story-box textarea { width: 100%; min-height: 140px; resize: vertical; font-family: inherit; font-size: 14px;
    color: #3a3a4a; line-height: 1.7; border: 1px solid rgba(58,58,74,0.16); border-radius: 12px; padding: 12px;
    background: #fbfbff; outline: none; transition: border-color .2s, box-shadow .2s; }
  .story-box textarea:focus { border-color: rgba(158,193,255,0.9); box-shadow: 0 0 0 3px rgba(158,193,255,0.18); }
  .row2 { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }

  /* ===== 弹窗 ===== */
  .modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: rgba(30,26,46,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 16px; }
  .modal-card { width: min(460px, 94vw); max-height: 88vh; overflow-y: auto; background: rgba(255,255,255,0.96);
    border-radius: 22px; box-shadow: 0 24px 70px rgba(80,60,140,0.32); padding: 22px; }
  .modal-card h3 { font-size: 17px; letter-spacing: 0.08em; color: #3a3a4a; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #5a4a8a; margin-bottom: 6px; letter-spacing: 0.04em; }
  .field input[type=text], .field input[type=date], .field textarea { width: 100%; font-family: inherit; font-size: 14px; color: #3a3a4a;
    border: 1px solid rgba(58,58,74,0.16); border-radius: 12px; padding: 10px 12px; background: #fbfbff; outline: none; }
  .field input[type=text]:focus, .field input[type=date]:focus, .field textarea:focus { border-color: rgba(158,193,255,0.9); box-shadow: 0 0 0 3px rgba(158,193,255,0.18); }
  .field textarea { resize: vertical; min-height: 90px; }
  .filepick { font-size: 13px; color: #6a6a82; }
  .filepick input[type=file] { margin-top: 6px; font-size: 13px; }
  .previews { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .previews img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(58,58,74,0.1); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); z-index: 50;
    background: rgba(40,34,60,0.92); color: #fff; font-size: 13px; letter-spacing: 0.04em; padding: 11px 20px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 560px) { .topbar { padding: 14px 16px; } .topbar .title { font-size: 16px; } }
</style>
</head>
<body>
  <script>var EMBEDDED = (window.self !== window.top); if (EMBEDDED) document.documentElement.classList.add('embedded');</script>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>
  <div class="veil" aria-hidden="true"></div>

  <div class="topbar">
    <div class="title">班级故事</div>
    <div class="topbar-right">
      <button class="btn primary" id="newBtn">＋ 新建人物</button>
      <a class="back" id="backLink" href="memory.html">← 返回</a>
    </div>
  </div>

  <!-- 列表 -->
  <div class="wrap list" id="listView">
    <div class="sub">记录每一个人的名字、照片与故事 · ☁️ 云端共享，所有人可见</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- 详情：故事时间轴 -->
  <div class="detail hidden" id="detailView">
    <button class="back" id="backToList" style="margin-bottom:14px; display:inline-block;">← 返回列表</button>
    <div class="dname" id="dName"></div>
    <div class="dtime" id="dTime"></div>
    <div class="addphoto">
      <button class="btn primary" id="newEntryBtn">＋ 写一个故事</button>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- 新建故事弹窗 -->
  <div class="modal hidden" id="entryModal">
    <div class="modal-card">
      <h3>写一个故事</h3>
      <div class="field">
        <label>故事标题（显示在时间轴亮点旁）</label>
        <input type="text" id="entryTitle" maxlength="50" placeholder="例如：运动会上的三千米" />
      </div>
      <div class="field">
        <label>故事发生的时间（可不填，默认为今天）</label>
        <input type="date" id="entryDate" />
      </div>
      <div class="field">
        <label>故事内容</label>
        <textarea id="entryBody" placeholder="写下这段回忆…（可留空只放照片）"></textarea>
      </div>
      <div class="field">
        <label>照片（可多选，可只传照片不写文字）</label>
        <div class="filepick">
          <input type="file" id="entryPhotos" accept="image/*" multiple />
        </div>
        <div class="previews" id="entryPreviews"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelEntry">取消</button>
        <button class="btn primary" id="confirmEntry">发布</button>
      </div>
    </div>
  </div>

  <!-- 图片放大查看 -->
  <div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt="照片查看" /></div>

  <!-- 新建人物弹窗 -->
  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <h3>新建人物</h3>
      <div class="field">
        <label>姓名 / 昵称</label>
        <input type="text" id="newName" maxlength="30" placeholder="例如：小明" />
      </div>
      <div class="field">
        <label>上传照片（可多选）</label>
        <div class="filepick">
          <input type="file" id="newPhotos" accept="image/*" multiple />
        </div>
        <div class="previews" id="newPreviews"></div>
      </div>
      <div class="field">
        <label>写点他的故事</label>
        <textarea id="newStory" placeholder="关于这个人的第一段介绍…（可留空，之后用「写一个故事」慢慢补充）"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelNew">取消</button>
        <button class="btn primary" id="confirmNew">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // ====== Supabase 云端配置（与留言板同一项目，所有人共享数据）======
  const SB_URL = "https://clgkifcfjesvgmsvexkm.supabase.co";
  const SB_KEY = "sb_publishable__hFsWHorCWwJrayab_9hzA_xD1W-4TP";
  const TABLE = "story_people";
  const ETABLE = "story_entries";
  const BUCKET = "story-photos";
  const AUTH_HEADERS = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };

  const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmt = (ts) => {
    const d = new Date(Number(ts) || Date.now());
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const escapeHtml = (s) => String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ====== 云端 API 封装 ======
  async function apiList() {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?select=*&order=updated_at.desc&limit=500`, { headers: AUTH_HEADERS });
    if (!r.ok) throw new Error("list failed: " + r.status);
    return r.json();
  }
  async function apiGet(id) {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}&select=*`, { headers: AUTH_HEADERS });
    if (!r.ok) throw new Error("get failed: " + r.status);
    const arr = await r.json();
    return arr[0] || null;
  }
  async function apiInsert(row) {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}`, {
      method: "POST", headers: { ...AUTH_HEADERS, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(row),
    });
    if (!r.ok && r.status !== 201) throw new Error("insert failed: " + r.status);
  }
  async function apiUpdate(id, patch) {
    const r = await fetch(`${SB_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`, {
      method: "PATCH", headers: { ...AUTH_HEADERS, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(patch),
    });
    if (!r.ok && r.status !== 204) throw new Error("update failed: " + r.status);
  }
  // ====== 故事条目 API（story_entries 表）======
  async function entryList(personId) {
    const r = await fetch(`${SB_URL}/rest/v1/${ETABLE}?person_id=eq.${encodeURIComponent(personId)}&select=*&order=happened_at.desc&limit=1000`, { headers: AUTH_HEADERS });
    if (!r.ok) throw new Error("entry list failed: " + r.status);
    return r.json();
  }
  async function entryCountAll() {
    // 每个人物条目数 + 最新故事时间 + 最新故事标题（用于列表卡片），一次拉全表在本地聚合（数据量级为班级规模，完全够用）
    const r = await fetch(`${SB_URL}/rest/v1/${ETABLE}?select=person_id,title,happened_at,created_at&order=created_at.asc&limit=5000`, { headers: AUTH_HEADERS });
    if (!r.ok) throw new Error("entry agg failed: " + r.status);
    const rows = await r.json();
    const map = {};
    for (const e of rows) {
      const m = map[e.person_id] || (map[e.person_id] = { count: 0, latest: 0, latestTitle: "" });
      m.count++;
      if ((e.happened_at || 0) > m.latest) { m.latest = e.happened_at || 0; m.latestTitle = e.title || ""; }
      else if ((e.happened_at || 0) === m.latest && !m.latestTitle) m.latestTitle = e.title || "";
    }
    return map;
  }
  async function entryInsert(row) {
    const r = await fetch(`${SB_URL}/rest/v1/${ETABLE}`, {
      method: "POST", headers: { ...AUTH_HEADERS, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(row),
    });
    if (!r.ok && r.status !== 201) throw new Error("entry insert failed: " + r.status);
  }

  // 照片存 Storage：路径 personId/photoId.jpg；公开桶 => 直接拼公开 URL，无需签名
  function photoUrl(personId, photoId) {
    return `${SB_URL}/storage/v1/object/public/${BUCKET}/${personId}/${photoId}.jpg`;
  }
  // 故事照片在 entry_photo/<entryId>/ 子目录（每条故事独立目录，互不串位）
  function entryPhotoUrl(personId, entryId, photoId) {
    return `${SB_URL}/storage/v1/object/public/${BUCKET}/${personId}/entry_photo/${entryId}/${photoId}.jpg`;
  }
  // 列出某条故事下的照片 id（按上传时间升序）
  async function listEntryPhotos(personId, entryId) {
    const r = await fetch(`${SB_URL}/storage/v1/object/list/${BUCKET}`, {
      method: "POST", headers: { ...AUTH_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: `${personId}/entry_photo/${entryId}/`, limit: 1000, sortBy: { column: "created_at", order: "asc" } }),
    });
    if (!r.ok) throw new Error("photo list failed: " + r.status);
    const arr = await r.json();
    return (arr || [])
      .filter(o => o.name && /\.jpe?g$/i.test(o.name))
      .map(o => o.name.replace(/\.jpe?g$/i, ""));
  }
  // 人物头像缩略图（新建人物时传的），路径 personId/photoId.jpg（根目录）
  async function listPhotos(personId) {
    const r = await fetch(`${SB_URL}/storage/v1/object/list/${BUCKET}`, {
      method: "POST", headers: { ...AUTH_HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: personId + "/", limit: 100, delimiter: "/", sortBy: { column: "created_at", order: "asc" } }),
    });
    if (!r.ok) throw new Error("photo list failed: " + r.status);
    const arr = await r.json();
    return (arr || [])
      .filter(o => o.name && /\.jpe?g$/i.test(o.name))
      .map(o => o.name.replace(/\.jpe?g$/i, ""));
  }
  async function uploadPhoto(personId, photoId, file, subfolder) {
    // 统一转 JPEG 压缩，控制单张体积（最长边 1600px，质量 0.82）
    const blob = await compressImage(file, 1600, 0.82);
    const path = subfolder ? `${personId}/${subfolder}/${photoId}.jpg` : `${personId}/${photoId}.jpg`;
    const r = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: "POST", headers: { ...AUTH_HEADERS, "Content-Type": "image/jpeg" },
      body: blob,
    });
    if (!r.ok) throw new Error("photo upload failed: " + r.status);
  }
  // 客户端压缩：减小上传体积，加快弱网（校园网）上传
  function compressImage(file, maxEdge, quality) {
    return new Promise((resolve, reject) => {
      if (!/^image\//.test(file.type)) { reject(new Error("not an image")); return; }
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          let w = img.naturalWidth, h = img.naturalHeight;
          const scale = Math.min(1, maxEdge / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          const ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          cv.toBlob((b) => {
            URL.revokeObjectURL(url);
            if (b) resolve(b); else reject(new Error("toBlob failed"));
          }, "image/jpeg", quality);
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image decode failed")); };
      img.src = url;
    });
  }

  // ====== 视图切换与状态 ======
  const grid = document.getElementById("grid");
  const listView = document.getElementById("listView");
  const detailView = document.getElementById("detailView");
  const timelineEl = document.getElementById("timeline");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  let currentId = null;
  function setBusy(on, text) {
    const sub = document.querySelector("#listView .sub");
    if (sub && on) sub.textContent = text || "⏳ 云端加载中…";
    if (sub && !on) sub.textContent = "记录每一个人的名字、照片与故事 · ☁️ 云端共享，所有人可见";
  }
  // 日期格式化：把当天 00:00 的本地毫秒值或日期串转成「YYYY年M月D日」
  const fmtDay = (v) => {
    if (!v) return "";
    const d = (typeof v === "string") ? new Date(v + "T00:00:00") : new Date(Number(v));
    if (isNaN(d)) return "";
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  };
  // date input 值(YYYY-MM-DD) -> 当天本地 00:00 毫秒
  const dayToTs = (s) => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? Date.now() : d.getTime(); };

  // ====== 列表视图 ======
  async function renderList() {
    setBusy(true);
    let people, emap;
    try { [people, emap] = await Promise.all([apiList(), entryCountAll()]); }
    catch (e) {
      setBusy(false);
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">⚠️ 云端连接失败，稍后刷新重试。<br><span style="font-size:12px;">${escapeHtml(e.message)}</span></div>`;
      return;
    }
    setBusy(false);
    if (!people.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="big">📖</div>还没有记录任何人的故事。<br>点右上角「＋ 新建人物」开始吧。</div>`;
      return;
    }
    grid.innerHTML = people.map(p => {
      const agg = emap[p.id];
      const cnt = agg ? ` · ${agg.count} 个故事` : "";
      const intro = escapeHtml(p.story || (agg && agg.latestTitle ? `最新故事：${agg.latestTitle}` : "（还没有写故事）"));
      const lastT = agg && agg.latest ? `最近的故事：${fmtDay(agg.latest)}` : `更新于 ${fmt(p.updated_at)}`;
      const thumb = p.photo_count
        ? `<img class="thumb" loading="lazy" data-person="${p.id}" alt="${escapeHtml(p.name)}" onerror="this.outerHTML='<div class=\\'ph-placeholder\\'>🙂</div>'">`
        : `<div class="ph-placeholder">🙂</div>`;
      return `<div class="person" data-id="${p.id}">
        ${thumb}
        <div class="meta">
          <div class="pname">${escapeHtml(p.name)}</div>
          <div class="pstory">${intro}</div>
          <div class="ptime">${lastT}${cnt}</div>
        </div>
      </div>`;
    }).join("");
    // 惰性加载每张缩略图的真实首图 id
    grid.querySelectorAll("img.thumb[data-person]").forEach(img => {
      const pid = img.dataset.person;
      listPhotos(pid).then(ids => { if (ids.length) img.src = photoUrl(pid, ids[0]); else img.outerHTML = `<div class='ph-placeholder'>🙂</div>`; })
        .catch(() => { /* 保留占位符 */ });
    });
    grid.querySelectorAll(".person").forEach(el => el.addEventListener("click", () => openDetail(el.dataset.id)));
  }

  // ====== 详情视图：故事时间轴 ======
  async function openDetail(id) {
    setBusy(true);
    let p, entries;
    try { [p, entries] = await Promise.all([apiGet(id), entryList(id)]); }
    catch (e) { setBusy(false); toast("加载失败：" + e.message); return; }
    setBusy(false);
    if (!p) { toast("未找到该人物"); return; }
    currentId = id;
    listView.classList.add("hidden");
    detailView.classList.remove("hidden");
    document.getElementById("dName").textContent = p.name;
    document.getElementById("dTime").textContent = entries.length
      ? `${entries.length} 个故事 · 由同学们共同记录`
      : "还没有故事，点上方「＋ 写一个故事」开始";
    renderTimeline(id, entries);
    window.scrollTo(0, 0);
  }

  function renderTimeline(personId, entries) {
    if (!entries.length) {
      timelineEl.innerHTML = `<div class="tempty">🌱 时间轴还是空的<br>每写下一个故事，这里就会亮起一颗星</div>`;
      return;
    }
    // 后端已按 happened_at.desc 排序；同日多条按创建时间稳定排列
    timelineEl.innerHTML = entries.map(e => {
      const title = escapeHtml(e.title || "（无标题）");
      const body = e.body ? escapeHtml(e.body) : "";
      const day = fmtDay(e.happened_at);
      const cnt = e.photo_count || 0;
      const photosHtml = cnt
        ? `<div class="tphotos" data-person="${personId}" data-entry="${e.id}">${Array.from({ length: cnt }, (_, i) => `<img loading="lazy" data-idx="${i}" alt="故事照片 ${i + 1}">`).join("")}</div>`
        : "";
      return `<div class="tnode">
        <div class="tdot"></div>
        <div class="tcard">
          <div class="tdate">✦ ${day}</div>
          <div class="ttitle">${title}</div>
          ${body ? `<div class="tbody">${body}</div>` : ""}
          ${photosHtml}
          <div class="tmeta">发布于 ${fmt(e.created_at)} · ☁️ 所有人可见</div>
        </div>
      </div>`;
    }).join("");
    // 惰性填充每条故事的照片 URL（每条故事独立目录，按目录为准）
    timelineEl.querySelectorAll(".tphotos").forEach(ph => {
      const pid = ph.dataset.person;
      const eid = ph.dataset.entry;
      listEntryPhotos(pid, eid).then(ids => {
        if (!ids.length) { ph.style.display = "none"; return; }
        ph.querySelectorAll("img[data-idx]").forEach(img => {
          const i = Number(img.dataset.idx);
          if (ids[i]) img.src = entryPhotoUrl(pid, eid, ids[i]);
          else img.style.display = "none";
        });
      }).catch(() => { ph.style.display = "none"; });
    });
    // 点击放大
    timelineEl.querySelectorAll(".tphotos img").forEach(img => {
      img.addEventListener("click", () => {
        if (!img.src) return;
        lightboxImg.src = img.src;
        lightbox.classList.remove("hidden");
      });
    });
  }
  lightbox.addEventListener("click", () => { lightbox.classList.add("hidden"); lightboxImg.src = ""; });
  function backToList() {
    detailView.classList.add("hidden");
    listView.classList.remove("hidden");
    currentId = null;
    renderList();
  }
  document.getElementById("backToList").addEventListener("click", backToList);

  // ====== 写故事弹窗 ======
  const entryModal = document.getElementById("entryModal");
  const entryPreviews = document.getElementById("entryPreviews");
  let pendingEntryPhotos = [];
  function openEntryModal() {
    document.getElementById("entryTitle").value = "";
    document.getElementById("entryBody").value = "";
    document.getElementById("entryDate").value = "";
    document.getElementById("entryPhotos").value = "";
    pendingEntryPhotos = [];
    entryPreviews.innerHTML = "";
    entryModal.classList.remove("hidden");
    document.getElementById("entryTitle").focus();
  }
  function closeEntryModal() { entryModal.classList.add("hidden"); }
  document.getElementById("newEntryBtn").addEventListener("click", openEntryModal);
  document.getElementById("cancelEntry").addEventListener("click", closeEntryModal);
  entryModal.addEventListener("click", (e) => { if (e.target === entryModal) closeEntryModal(); });

  document.getElementById("entryPhotos").addEventListener("change", (e) => {
    const files = Array.from(e.target.files || []);
    pendingEntryPhotos = files;
    entryPreviews.innerHTML = files.map(f => `<img src="${URL.createObjectURL(f)}">`).join("");
  });

  document.getElementById("confirmEntry").addEventListener("click", async () => {
    if (!currentId) return;
    const title = document.getElementById("entryTitle").value.trim();
    const body = document.getElementById("entryBody").value.trim();
    const dateVal = document.getElementById("entryDate").value;
    if (!title && !body && !pendingEntryPhotos.length) { toast("至少写点文字或选一张照片"); return; }
    const btn = document.getElementById("confirmEntry");
    btn.disabled = true; btn.textContent = "⏳ 发布中…";
    try {
      const happenedTs = dateVal ? dayToTs(dateVal) : Date.now();
      // 1) 先定故事 id，照片传到它的独立目录 entry_photo/<entryId>/
      const entryId = uid();
      let uploaded = 0;
      for (const f of pendingEntryPhotos) {
        if (!/^image\//.test(f.type)) continue;
        const phid = uid();
        try { await uploadPhoto(currentId, phid, f, "entry_photo/" + entryId); uploaded++; }
        catch (err) { console.warn("单张照片上传失败：", err); }
      }
      // 2) 建故事行（标题可空时用首句或日期兜底）
      const finalTitle = title || (body ? body.slice(0, 16) : fmtDay(happenedTs) + " 的故事");
      await entryInsert({
        id: entryId,
        person_id: currentId,
        title: finalTitle,
        body,
        happened_at: happenedTs,
        photo_count: uploaded,
        created_at: Date.now(),
      });
      // 3) 顺带刷新人物 updated_at
      await apiUpdate(currentId, { updated_at: Date.now() });
      closeEntryModal();
      toast("故事已发布（云端，所有人可见）");
      openDetail(currentId);
    } catch (e) {
      toast("发布失败：" + e.message);
    }
    btn.disabled = false; btn.textContent = "发布";
  });

  // ====== 新建人物 ======
  const modal = document.getElementById("modal");
  const newPreviews = document.getElementById("newPreviews");
  let pendingNewPhotos = [];
  function openModal() {
    document.getElementById("newName").value = "";
    document.getElementById("newStory").value = "";
    document.getElementById("newPhotos").value = "";
    pendingNewPhotos = [];
    newPreviews.innerHTML = "";
    modal.classList.remove("hidden");
  }
  function closeModal() { modal.classList.add("hidden"); }
  document.getElementById("newBtn").addEventListener("click", openModal);
  document.getElementById("cancelNew").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  document.getElementById("newPhotos").addEventListener("change", (e) => {
    const files = Array.from(e.target.files || []);
    pendingNewPhotos = files;
    newPreviews.innerHTML = files.map(f => `<img src="${URL.createObjectURL(f)}">`).join("");
  });

  document.getElementById("confirmNew").addEventListener("click", async () => {
    const name = document.getElementById("newName").value.trim();
    const story = document.getElementById("newStory").value.trim();
    if (!name) { toast("请先填写姓名"); document.getElementById("newName").focus(); return; }
    const btn = document.getElementById("confirmNew");
    btn.disabled = true; btn.textContent = "⏳ 保存中…";
    try {
      const now = Date.now();
      const id = uid();
      // 1) 建行（照片清单以 Storage 目录为准，行里只存计数）
      await apiInsert({
        id, name, story,
        photo_count: 0,
        created_at: now, updated_at: now,
      });
      // 2) 传照片（成功一张记一张）
      let uploaded = 0;
      for (const f of pendingNewPhotos) {
        if (!/^image\//.test(f.type)) continue;
        const phid = uid();
        try { await uploadPhoto(id, phid, f); uploaded++; }
        catch (err) { console.warn("单张照片上传失败：", err); }
      }
      if (uploaded) {
        await apiUpdate(id, { photo_count: uploaded, updated_at: Date.now() });
      }
      closeModal();
      toast(`已新建「${name}」（云端，所有人可见）`);
      openDetail(id);
    } catch (e) {
      toast("新建失败：" + e.message);
    }
    btn.disabled = false; btn.textContent = "保存";
  });

  // ====== 内嵌返回 ======
  if (EMBEDDED) {
    const back = document.getElementById("backLink");
    back.addEventListener("click", (e) => { e.preventDefault(); if (window.parent && window.parent.closeMemory) window.parent.closeMemory(); });
  }

  // 首屏渲染
  renderList();
})();
</script>
</body>
</html>
